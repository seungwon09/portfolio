<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>편집 · 포트폴리오</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="editor-body">
  <header class="topbar"><div class="topbar-inner"></div></header>

  <!-- 로그인 -->
  <section class="ed-login" id="login" hidden>
    <h1>편집 모드</h1>
    <p>이 저장소에 쓰기 권한이 있는 GitHub 토큰을 입력하면 이 브라우저에서만 편집 모드가 켜집니다.</p>
    <input type="password" id="token" placeholder="github_pat_..." autocomplete="off">
    <button id="loginBtn" class="ed-btn primary">로그인</button>
    <p class="ed-msg" id="loginMsg"></p>
  </section>

  <!-- 편집기 -->
  <section class="ed-wrap" id="editor" hidden>
    <div class="ed-bar">
      <select id="file"></select>
      <button id="newFile" class="ed-btn">새 파일</button>
      <span class="ed-spacer"></span>
      <label class="ed-btn">이미지 업로드<input type="file" id="imgInput" accept="image/*" hidden></label>
      <button id="previewToggle" class="ed-btn">미리보기</button>
      <button id="save" class="ed-btn primary">저장</button>
      <button id="logout" class="ed-btn">로그아웃</button>
    </div>
    <p class="ed-msg" id="msg"></p>
    <div class="ed-panes">
      <textarea id="src" spellcheck="false"></textarea>
      <article class="content ed-preview" id="preview" hidden></article>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="assets/site.js"></script>
  <script src="assets/edit.js"></script>
</body>
</html>
